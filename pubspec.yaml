# استبدل محتوى pubspec.yaml بـ:
name: zadam_delivery
description: نظام إدارة توصيل طلبات - شركة زادم
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  
  provider: ^6.0.0        # ✅ الإصدار الصحيح (ليس 6.2.0)
  
  google_fonts: ^6.1.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.0
  shimmer: ^3.0.0
  fl_chart: ^0.65.0

  uuid: ^4.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/