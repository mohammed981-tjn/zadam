name: Sudan minerals (USGS)

# Pulls the mineral layers of the USGS "Compilation of Geospatial Data (GIS)
# for the Mineral Industries and Related Infrastructure of Africa" (2021,
# doi:10.5066/P97EQWXP, public domain) and keeps the features inside Sudan's
# bounding box as GeoJSON under data/minerals-raw/. ScienceBase is not
# reachable from the environment this repository is developed in; a runner is.
#
# Manual only, and short: one download, GDAL clips each layer to the box. scripts/build-sudan-minerals.ts then reduces the raw files to what the
# map draws, clipped to the border itself.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minerals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin

      - name: Download and clip
        run: |
          set -e
          curl -sSL -o /tmp/africa.zip "https://www.sciencebase.gov/catalog/file/get/607611a9d34e018b3201cbbf?name=Africa_GIS.gdb.zip"
          ls -la /tmp/africa.zip
          mkdir -p /tmp/gdb && unzip -q -o /tmp/africa.zip -d /tmp/gdb
          GDB=$(find /tmp/gdb -maxdepth 3 -type d -name '*.gdb' | head -1)
          echo "gdb: $GDB"
          mkdir -p data/minerals-raw
          ogrinfo -ro -so "$GDB" | tee data/minerals-raw/_layers.txt
          # Lines read "Layer: AFR_Mineral_Deposits (3D Measured Point)".
          # Every mineral, infrastructure and oil-and-gas layer. Lines and
          # polygons are clipped to the box and simplified to ~1 km, which is
          # finer than the map can draw and keeps the files small.
          for L in $(ogrinfo -ro -so "$GDB" | grep -E '^Layer: AFR_(Mineral|Infra|OG)_' | sed -E 's/^Layer: ([^ ]+) .*/\1/'); do
            if ogrinfo -ro -so "$GDB" | grep -E "^Layer: $L " | grep -q Point; then
              ogr2ogr -f GeoJSON -dim XY -t_srs EPSG:4326 -spat 21.8 8.6 38.7 23.2 -spat_srs EPSG:4326 \
                "data/minerals-raw/$L.geojson" "$GDB" "$L" || echo "skip $L"
            else
              ogr2ogr -f GeoJSON -dim XY -t_srs EPSG:4326 -spat 21.8 8.6 38.7 23.2 -spat_srs EPSG:4326 \
                -clipsrc 21.8 8.6 38.7 23.2 -simplify 0.01 -lco COORDINATE_PRECISION=3 \
                "data/minerals-raw/$L.geojson" "$GDB" "$L" || echo "skip $L"
            fi
            echo "$L: $(grep -o '"type": "Feature"' "data/minerals-raw/$L.geojson" | wc -l) features" | tee -a data/minerals-raw/_layers.txt
          done
          du -sh data/minerals-raw

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/minerals-raw
          if git diff --cached --quiet; then echo 'unchanged'; exit 0; fi
          git commit -m 'Fetch Sudan mineral and infrastructure layers (USGS Africa GIS, 2021)'
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
