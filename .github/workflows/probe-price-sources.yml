name: Probe price sources

# Prints what each candidate price source answers (backlog 176). The development container
# cannot reach these sites; a runner can. Read-only: nothing is committed or written.
# By hand only (Actions → Run workflow). First run: 24 October 2026, which found that
# iqraa24.com now redirects to pls48.net, and that bajnews prints the bank's rate in a sentence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-price-sources.mjs
