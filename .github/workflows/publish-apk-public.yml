name: Publish the APK publicly (temporary)

# The owner, 6 November 2026: «رابط عامّ دائم» — the app on a public, permanent download link. Builds the APK from
# main exactly as mobile.yml does and puts it on the «app-latest» release as sudagri.apk, so
# https://github.com/mohammed981-tjn/zadam/releases/download/app-latest/sudagri.apk always points at the newest one.
# Temporary: removed before the branch merges.
on:
  push:
    branches: [claude/project-review-analysis-dt7lsy]
    paths: [".github/workflows/publish-apk-public.yml"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Build APK
        working-directory: mobile
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          flutter pub get
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --build-number=$((1000 + ${{ github.run_number }})) \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SITE_URL="$SITE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk ../sudagri.apk

      - name: Publish on the «app-latest» release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum sudagri.apk
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest sudagri.apk --clobber
          else
            gh release create app-latest sudagri.apk --target main --latest \
              --title "تطبيق سوداقري للأندرويد" \
              --notes "حمّل sudagri.apk وثبّته على جوّال أندرويد (اسمح بالتثبيت من مصادر غير معروفة إن طلب الجوّال ذلك). كلّ نسخةٍ جديدة تُثبَّت فوق السابقة."
          fi
          gh release view app-latest
