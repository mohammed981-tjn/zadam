name: Mobile app

# Checks the Flutter app on every pull request; builds and publishes an
# installable APK only when run by hand.
#
# The analyzer and the tests catch most mistakes, but only assembling an APK
# proves the native Android side compiles; that now happens on the manual run,
# so run it before telling anyone a native change works.
#
# The APK is a release build, obfuscated, signed with the fixed key in the
# repository so each one installs over the last. Publishing to a store needs an
# upload key that belongs to whoever owns the listing rather than to this
# repository, so this stops at "installable by hand" — the useful artefact while
# there is no listing yet.

# A pull request that touches the app is analysed and tested, nothing more.
# The APK is built and published only when it is asked for (the owner,
# 4 October: «لا تستخرج apk في كل مرة إلا بإذن»): run this workflow by hand,
# from the Actions tab or `workflow_dispatch`, once the owner says so. A merge
# to main no longer builds anything; the pull request already checked it.
on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

# A newer commit on the same branch makes the running build pointless.
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write to publish the APK to the «app-latest» release.
    permissions:
      contents: write
    # A full build takes about six minutes; anything past this is stuck.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      # With the app's 13 new sections and their plugins, the release build's native libraries for three ABIs no longer
      # fit beside the runner's preinstalled toolchains (run 265: «No space left on device» stripping libapp.so). These
      # are SDKs this job never uses; Android's own SDK and Java stay.
      - name: Free disk space on the runner
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Fails the build on any analyzer complaint, not just errors — the app is
      # small enough that keeping it at zero costs nothing and drifts otherwise.
      - name: Analyze
        run: flutter analyze --fatal-infos

      # Includes the parity suite that pins the Dart water engine against the
      # numbers the TypeScript one produces. If the two implementations drift,
      # this is what catches it.
      - name: Test
        run: flutter test

      # محاكي التطبيق (البند ٢٠٢؛ المالك، 6 نوفمبر 2026: «ابني محاكي للاختبارات والمعاينة»): the app built for the
      # browser, opened in Chromium at a phone's size, every tab of the bottom bar photographed, and the run fails if
      # the page throws. The screenshots are an artifact of the run, for review — nothing is published.
      - name: Preview the screens in a phone-sized browser
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.56.1 >/dev/null
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium >/dev/null
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" OUT="$RUNNER_TEMP/app-preview" ../scripts/app-preview.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: app-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/app-preview
          retention-days: 14

      # إشعارات الجوّال (البند ٢٠٧): إعداد مشروع Firebase من سرّ المستودع GOOGLE_SERVICES_JSON، إن ضبطه المالك
      # (docs/push-setup-ar.md). الملفّ ليس سرّاً، لكنّه خاصٌّ بمشروعه والمستودع عامّ، فيبقى في الأسرار لا في الشجرة.
      # وبلا السرّ يُبنى التطبيق كما كان والإشعارات مطفأة: Gradle لا يطبّق إضافة Google إلا حين يوجد الملفّ.
      - name: Firebase configuration for phone notifications (if set)
        if: github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            if ! python3 -c 'import json,sys; d=json.load(open("android/app/google-services.json")); sys.exit(0 if any(c["client_info"]["android_client_info"]["package_name"]=="sd.sudagri.sudagri" for c in d["client"]) else 1)'; then
              echo "::error::GOOGLE_SERVICES_JSON is not a google-services.json for the package sd.sudagri.sudagri."
              exit 1
            fi
            echo "Phone notifications: on (google-services.json written from the secret)."
          else
            echo "::notice::GOOGLE_SERVICES_JSON is not set — this APK builds with phone notifications off."
          fi

      # None of these are secrets — the Supabase anon key is publishable by
      # design and every table it reaches is guarded by row-level security on
      # the server. They live in repository variables so a fork building this
      # workflow gets an app that runs rather than one that silently cannot
      # reach anything.
      # Only on request (see the `on:` block above).
      - name: Build APK
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL repository variable is unset."
            echo "::warning::The APK will build, but the knowledge screen will have nothing to read."
            echo "::warning::Set it under Settings > Secrets and variables > Actions > Variables."
          fi

          # Release, not debug. A debug APK ships the Dart kernel plus debugging
          # metadata and reads almost like source; a release build AOT-compiles
          # Dart to native ARM, which is a different order of difficulty to
          # inspect — and is also several times smaller and much faster to start.
          #
          # --obfuscate renames symbols on top of that, and needs
          # --split-debug-info to put the mapping somewhere. That mapping is what
          # turns a future crash report back into readable frames, so it is
          # uploaded as its own artifact rather than discarded.
          #
          # None of this makes the binary secret, and nothing is stored here as
          # though it were: the Supabase key it carries is publishable by design
          # and every table behind it is guarded by row-level security on the
          # server, which is the only place a guard survives being on someone
          # else's device.
          #
          # The build number climbs with the run number. Android will not install
          # a build whose versionCode is lower than the one already present, and
          # a version pinned in pubspec.yaml never moves — so without this every
          # build after the first looks like a downgrade to the device.
          # The 1000 on top: the public build of 6 November (versionCode 1001) came from another workflow, and a
          # later build here must still count as newer than it.
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --build-number=$((1000 + ${{ github.run_number }})) \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SITE_URL="$SITE_URL"

      # A public, permanent link (the owner, 6 November 2026: «رابط عامّ دائم»), replacing the locked delivery of
      # 26 October: each manual build replaces sudagri.apk on the «app-latest» release, so
      # https://github.com/mohammed981-tjn/zadam/releases/download/app-latest/sudagri.apk is always the newest.
      - name: Publish the APK on the public link
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk sudagri.apk
          sha256sum sudagri.apk
          if gh release view app-latest >/dev/null 2>&1; then
            gh release upload app-latest sudagri.apk --clobber
          else
            gh release create app-latest sudagri.apk --target main --latest \
              --title "تطبيق سوداقري للأندرويد" \
              --notes "حمّل sudagri.apk وثبّته على جوّال أندرويد. كلّ نسخةٍ جديدة تُثبَّت فوق السابقة."
          fi

      # Without these a crash report from an obfuscated build is unreadable
      # noise. They are only useful next to the exact APK they came from, hence
      # the run number in the name.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: sudagri-symbols-${{ github.run_number }}
          path: mobile/build/symbols
          if-no-files-found: warn
          retention-days: 14
