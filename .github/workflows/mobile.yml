name: Mobile app

# Builds the Flutter app and attaches an installable APK to the run.
#
# This workflow is also the app's only full build: the analyzer and the tests
# can run anywhere, but assembling an APK needs the Android SDK, so CI is where
# a change to the mobile app is actually proven to compile. A green analyze on
# a laptop is not evidence the thing installs.
#
# The APK is a release build, obfuscated, signed with the fixed key in the
# repository so each one installs over the last. Publishing to a store needs an
# upload key that belongs to whoever owns the listing rather than to this
# repository, so this stops at "installable by hand" — the useful artefact while
# there is no listing yet.

# Each commit is built once: a pull request builds its branch, and `push`
# builds only what lands on main. Before 25 September `push` had no branch
# filter, so every commit on a branch with an open pull request built twice —
# 169 minutes in one week of a private repository's allowance.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

# A newer commit on the same branch makes the running build pointless.
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A full build takes about six minutes; anything past this is stuck.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Fails the build on any analyzer complaint, not just errors — the app is
      # small enough that keeping it at zero costs nothing and drifts otherwise.
      - name: Analyze
        run: flutter analyze --fatal-infos

      # Includes the parity suite that pins the Dart water engine against the
      # numbers the TypeScript one produces. If the two implementations drift,
      # this is what catches it.
      - name: Test
        run: flutter test

      # None of these are secrets — the Supabase anon key is publishable by
      # design and every table it reaches is guarded by row-level security on
      # the server. They live in repository variables so a fork building this
      # workflow gets an app that runs rather than one that silently cannot
      # reach anything.
      - name: Build APK
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL repository variable is unset."
            echo "::warning::The APK will build, but the knowledge screen will have nothing to read."
            echo "::warning::Set it under Settings > Secrets and variables > Actions > Variables."
          fi

          # Release, not debug. A debug APK ships the Dart kernel plus debugging
          # metadata and reads almost like source; a release build AOT-compiles
          # Dart to native ARM, which is a different order of difficulty to
          # inspect — and is also several times smaller and much faster to start.
          #
          # --obfuscate renames symbols on top of that, and needs
          # --split-debug-info to put the mapping somewhere. That mapping is what
          # turns a future crash report back into readable frames, so it is
          # uploaded as its own artifact rather than discarded.
          #
          # None of this makes the binary secret, and nothing is stored here as
          # though it were: the Supabase key it carries is publishable by design
          # and every table behind it is guarded by row-level security on the
          # server, which is the only place a guard survives being on someone
          # else's device.
          #
          # The build number climbs with the run number. Android will not install
          # a build whose versionCode is lower than the one already present, and
          # a version pinned in pubspec.yaml never moves — so without this every
          # build after the first looks like a downgrade to the device.
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SITE_URL="$SITE_URL"

      # The APK is kept from push builds only. A branch with an open pull
      # request builds every commit twice — once for the push, once for the
      # pull request — and two copies of a 50 MB file for every commit, kept a
      # month, filled the account's artifact storage on 24 September 2026 and
      # failed a build that had compiled and passed every test.
      #
      # And an upload that fails does not fail the build: by this step the app
      # has been analysed, tested and assembled, which is what this workflow
      # proves. The file is a convenience for installing it by hand.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: sudagri-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      # Without these a crash report from an obfuscated build is unreadable
      # noise. They are only useful next to the exact APK they came from, hence
      # the run number in the name.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: sudagri-symbols-${{ github.run_number }}
          path: mobile/build/symbols
          if-no-files-found: warn
          retention-days: 30
