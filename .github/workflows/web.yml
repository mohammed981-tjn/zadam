name: Web app

# The check the platform did not have.
#
# mobile.yml already argues the principle for the Flutter app — "a green
# analyze on a laptop is not evidence the thing installs" — and then runs only
# on mobile/**. The 16,000 lines of TypeScript that are the actual product had
# nothing at all: no typecheck, no lint, no build, and eleven verification
# scripts totalling 2,400 lines that nothing ever executed.
#
# Note the order below. Typecheck first because it is the fastest way to fail,
# then lint, then the verifiers, and the production build last because it is
# the slowest. A contributor watching the run sees the cheapest failure first.

# `mobile/**` was ignored here, and that was correct until
# `scripts/verify-mobile-parity.ts` existed. That verifier reads the Flutter
# app's golden values and its texture tables and runs the web engines over
# them — so a change under mobile/ is now a change to this workflow's inputs.
# Skipping it would let a mobile-only push move a number and land green, then
# fail on some unrelated web commit days later, where nobody would think to
# look for the cause.
#
# WHY `push` IS LIMITED TO main
#
# This used to be a bare `push:` alongside `pull_request:`, and the two overlap:
# every push to a branch with an open PR fired the whole suite twice, on the same
# commit, to the same conclusion. That is double the minutes, and worse, it made
# "is it green?" a question with two answers — the PR page showed two `check`
# runs and a reader had to know they were the same thing.
#
# Keeping `pull_request` and narrowing `push` to main gives each commit exactly
# one run: on a branch the PR event covers it, and a direct push to main (or a
# squash-merge landing there) is still covered. Nothing loses coverage.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

# And if several commits land quickly, only the newest needs an answer.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `npm run typecheck` runs `next typegen` first, and that is not
      # incidental. Next writes its route types — LayoutProps, PageProps — into
      # .next/types, and src/app/layout.tsx uses them. On a developer's machine
      # they are already there from the last build, so tsc passes; on a fresh
      # checkout they do not exist and it fails with "Cannot find name
      # 'LayoutProps'".
      #
      # That is exactly what the first run of this workflow caught, and exactly
      # what no local run could: nobody here starts from an empty .next.
      # Generating them takes about a second, so the cheap checks still come
      # before the slow build instead of the build being run to produce types
      # as a side effect.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The engines, the FAO-56 water model, the risk and trust scorers, the
      # EXIF handling, the retrieval ranking — all checked against expected
      # ranges by scripts that already existed and were never run in CI.
      - name: Verify engines
        run: npm run verify

      # Last because it is the slowest, and because a build that compiles while
      # the water model returns nonsense is not the reassuring result.
      #
      # The Supabase values are placeholders: the build only needs them to be
      # present and well-formed, since no request is made at build time. Real
      # secrets are deliberately absent — a CI run should never be able to read
      # or write the production database.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only

  # ==========================================================================
  # الحرّاسُ الذين لا تُثبتهم تايبسكربت
  # ==========================================================================
  #
  # WHY A SECOND JOB, AND WHY IT WAS MISSING
  #
  # `npm run verify` globs scripts/verify-*.ts — Node only, no services. But the
  # guards that matter most on this platform are not TypeScript: they are CHECK
  # constraints, row-level security policies, function grants, and append-only
  # triggers. A constraint mocked in TypeScript proves nothing about the
  # constraint, so those gates were written as SQL against a real PostgreSQL.
  #
  # And then nothing ran them. 84 checks — the ones proving that `anon` cannot
  # read the complaints queue, that a machine reply cannot land under a human
  # one, that a frozen requirement cannot block deleting the live rule — sat
  # outside every automated run, executed only when someone remembered. A
  # migration edit could go green here while breaking any of them.
  #
  # It runs beside `check` rather than inside it: it needs no Node, no npm
  # install and no build, and a failure here should read as "a database guard
  # broke", not as one more red step in a job about typechecking.
  sql-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships PostgreSQL, but only the client on some images.
      # The gates build their own throwaway cluster, so they need the server
      # binaries — initdb and pg_ctl — not a running service.
      - name: PostgreSQL binaries
        run: |
          sudo apt-get update -qq
          if [ ! -x "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)/initdb" ]; then
            sudo apt-get install -y -qq postgresql
          fi
          # pgvector: `knowledge_entries` و`assistant_answers` تحملان عمود
          # `vector`، والتجهيزةُ تعلنه بنوعه الحقيقيّ لا ببديلٍ نصّيّ — فبديلٌ
          # نصّيٌّ هو نفسُ العطب الذي بُنيت التجهيزةُ لإزالته.
          PGMAJOR="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1 | grep -oE '[0-9]+' | tail -1)"
          sudo apt-get install -y -qq "postgresql-$PGMAJOR-pgvector"
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1

      # The runner is an ordinary user, not root — which is why these scripts
      # could not run here until the harness learned to skip `su postgres`.
      - name: ممرّ الصادر
        run: ./scripts/verify-export-offers.sh

      - name: الردّ الآلي على الشكاوى
        run: ./scripts/verify-support-auto-reply.sh

      - name: تدقيقُ عملية الاستثمار
        run: ./scripts/verify-investment-audit.sh

      # وهذه تسأل السؤال المعاكس. الثلاث فوقها تُثبت ما تمنعه المنصّة؛ هذه
      # وحدها تُثبت أنّ صاحب الحقّ يمرّ — ومنصّةٌ ترفض كلَّ شيء تنجح في الثلاث.
      - name: الرحلة الذهبيّة
        run: ./scripts/verify-farmer-journey.sh

      - name: رحلة المستثمر
        run: ./scripts/verify-investor-journey.sh

      - name: رحلة الأرض والموسم
        run: ./scripts/verify-land-season-journey.sh

      # المرحلة ٣ تبدأ من هنا: درجةُ ثقةٍ محسوبةٌ من أدلّةٍ يسحبها صاحبُها ليست
      # درجةَ ثقة. فالدليلُ يُقفل قبل أن يُحسب عليه شيء.
      - name: قفلُ الأدلّة
        run: ./scripts/verify-evidence-lock.sh

      # وعلى الدليل المقفَل يُحسب الرقم: «٧ من ٨» — وأيُّ الثامن. وأكثرُ ما
      # تحرسه هذه ليس الحساب بل الحاجز: الدالّتان `security definer`، فحاجزُهما
      # الداخليُّ هو الحدُّ كلُّه بين رقمٍ للمشتري وتعدادٍ لمسوّدات الناس.
      - name: جاهزيّةُ العرض
        run: ./scripts/verify-export-readiness.sh

      # وجوازُ المزرعة: السجلُّ لا يعدّ إلّا ما حدث. وأثقلُ ما تحرسه ليس الحساب
      # بل الصلاحيّة — الهجرةُ تُسقط دالّةً تُرجع مالَ أيّ مزارعٍ يُطلب، و`drop`
      # تُعيد تنفيذَها إلى `PUBLIC` بلا كلمة.
      - name: جوازُ المزرعة
        run: ./scripts/verify-farm-passport.sh

      # وهذه تحرس تضييقَ حارس. `prevent_self_role_escalation` صار يسمح
      # investor ⇄ farmer، وتوسيعُ ثقبٍ في حارس أخطرُ أنواع التعديل — فتُفحص
      # الجهتان: أنّ المسموحَ يمرّ، وأنّ كلَّ طريقٍ إلى صلاحيةٍ ما زال يُرَدّ.
      - name: اختيار الدور
        run: ./scripts/verify-role-choice.sh

      # واللائحةُ تُعلن عمرَها. وأخطرُ ما تحرسه أنّ ممرّاً لم يُراجَع قطّ يُقرأ
      # متأخّراً لا حديثاً — و`null > 180` تساوي false، فالصياغةُ الساذجة تشهد
      # بالحداثة لما لم يفحصه أحد.
      - name: عمرُ اللائحة
        run: ./scripts/verify-rules-freshness.sh

      # ودورةُ حياة العقد. وأخطرُ ما تحرسه ليس الانتقالات بل الأسعار: `amount`
      # عمودٌ مولَّد من `quantity × unit_price`، وكلاهما كان قابلاً للتعديل من
      # أيّ الطرفين في أيّ وقت — و`sync_contract_total` يعيد حساب الإجماليّ
      # على الرقم الجديد بإخلاص.
      - name: دورةُ حياة العقد
        run: ./scripts/verify-contract-lifecycle.sh

      # والأخبار. وأخطرُ ما تحرسه أنّ المسوّدةَ لا تُرى: هذه أوّلُ جدولٍ يُسرّب
      # إلى **الخارج** إن أخطأت سياستُه، والصفحةُ التي تعرضه مخزَّنةٌ مؤقّتاً —
      # فتسريبةٌ واحدةٌ تُخبز في صفحةٍ تُقدَّم لكلّ قادم.
      - name: الأخبار
        run: ./scripts/verify-announcements.sh
