name: Map borders probe

# One-off (البند ١٧٤): what attributes do OpenFreeMap's boundary lines carry
# around the Halaib Triangle? The live map must hide the lines that separate
# the triangle from Sudan and keep every other border, and which attribute can
# tell them apart (adm0_l / adm0_r / disputed / claimed_by) can only be read
# from a real tile, which the sessions that build this code cannot fetch.
# Prints, never fails on content; delete this file once the answer is in
# docs/studies/halaib-borders-ar.md.

on:
  push:
    paths:
      - ".github/workflows/map-borders-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the boundary lines around Halaib
        run: |
          set -euo pipefail
          pip install --quiet mapbox-vector-tile==2.1.0 shapely
          curl -fsS --retry 3 -o style.json https://tiles.openfreemap.org/styles/liberty
          python3 - <<'EOF'
          import json, math, subprocess
          import mapbox_vector_tile as mvt
          s = json.load(open("style.json"))
          vec = next(v for v in s["sources"].values() if v.get("type") == "vector")
          subprocess.run(["curl", "-fsS", "--retry", "3", "-o", "tj.json", vec["url"]], check=True)
          tj = json.load(open("tj.json"))
          def tile(z, lon, lat):
              n = 2 ** z
              return (int((lon + 180) / 360 * n),
                      int((1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * n))
          def lonlat(z, x, y, px, py, extent=4096):
              n = 2 ** z
              lon = (x + px / extent) / n * 360 - 180
              lat = math.degrees(math.atan(math.sinh(math.pi * (1 - 2 * (y + 1 - py / extent) / n))))
              return round(lon, 3), round(lat, 3)
          for z, lon, lat in [(5, 36.6, 22.2), (7, 36.6, 22.2), (7, 33.0, 22.0), (7, 29.0, 22.0)]:
              x, y = tile(z, lon, lat)
              url = tj["tiles"][0].replace("{z}", str(z)).replace("{x}", str(x)).replace("{y}", str(y))
              subprocess.run(["curl", "-fsS", "--retry", "3", "-o", "t.pbf", url], check=True)
              d = mvt.decode(open("t.pbf", "rb").read(), default_options={"y_coord_down": True})
              b = d.get("boundary", {})
              print(f"== z{z} tile {x}/{y} (near {lon},{lat}): boundary features {len(b.get('features', []))}")
              for f in b.get("features", []):
                  p = f["properties"]
                  if p.get("admin_level", 9) > 2 and not p.get("disputed") and not p.get("claimed_by"):
                      continue
                  g = f["geometry"]
                  pts = g["coordinates"]
                  flat = []
                  def walk(c):
                      if c and isinstance(c[0], (int, float)):
                          flat.append(c)
                      else:
                          for i in c: walk(i)
                  walk(pts)
                  ll = [lonlat(z, x, y, a, bq, b.get("extent", 4096)) for a, bq in flat]
                  lons = [q[0] for q in ll]; lats = [q[1] for q in ll]
                  print("  ", {k: p[k] for k in sorted(p)}, "· lon", min(lons), max(lons), "· lat", min(lats), max(lats))
          EOF
