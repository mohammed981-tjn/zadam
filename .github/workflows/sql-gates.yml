name: SQL gates

# The database guards — CHECK constraints, row-level security, grants,
# append-only triggers — proven against a real PostgreSQL. Split out of
# web.yml on 25 September: they read only the migrations, the gate scripts
# and the base schema, so a change that touches none of those cannot move
# them, and running them on every pull request billed a private
# repository's minutes for an answer that could not have changed.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/*.sh"
      - "scripts/*.sql"
      - ".github/workflows/sql-gates.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/*.sh"
      - "scripts/*.sql"
      - ".github/workflows/sql-gates.yml"
  workflow_dispatch:

concurrency:
  group: sql-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # الحرّاسُ الذين لا تُثبتهم تايبسكربت
  # ==========================================================================
  #
  # WHY A SECOND JOB, AND WHY IT WAS MISSING
  #
  # `npm run verify` globs scripts/verify-*.ts — Node only, no services. But the
  # guards that matter most on this platform are not TypeScript: they are CHECK
  # constraints, row-level security policies, function grants, and append-only
  # triggers. A constraint mocked in TypeScript proves nothing about the
  # constraint, so those gates were written as SQL against a real PostgreSQL.
  #
  # And then nothing ran them. 84 checks — the ones proving that `anon` cannot
  # read the complaints queue, that a machine reply cannot land under a human
  # one, that a frozen requirement cannot block deleting the live rule — sat
  # outside every automated run, executed only when someone remembered. A
  # migration edit could go green here while breaking any of them.
  #
  # It runs beside `check` rather than inside it: it needs no Node, no npm
  # install and no build, and a failure here should read as "a database guard
  # broke", not as one more red step in a job about typechecking.
  sql-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships PostgreSQL, but only the client on some images.
      # The gates build their own throwaway cluster, so they need the server
      # binaries — initdb and pg_ctl — not a running service.
      - name: PostgreSQL binaries
        run: |
          sudo apt-get update -qq
          if [ ! -x "$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)/initdb" ]; then
            sudo apt-get install -y -qq postgresql
          fi
          # pgvector: `knowledge_entries` و`assistant_answers` تحملان عمود
          # `vector`، والتجهيزةُ تعلنه بنوعه الحقيقيّ لا ببديلٍ نصّيّ — فبديلٌ
          # نصّيٌّ هو نفسُ العطب الذي بُنيت التجهيزةُ لإزالته.
          PGMAJOR="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1 | grep -oE '[0-9]+' | tail -1)"
          sudo apt-get install -y -qq "postgresql-$PGMAJOR-pgvector"
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1

      # The runner is an ordinary user, not root — which is why these scripts
      # could not run here until the harness learned to skip `su postgres`.
      - name: ممرّ الصادر
        run: ./scripts/verify-export-offers.sh

      - name: النفير — الميثاق والفزعة والشورى
        run: ./scripts/verify-nafir.sh

      - name: الجودية — الوساطة بخطواتها
        run: ./scripts/verify-judiyya.sh

      - name: الترع — الحدود والنصيب والنوبات
        run: ./scripts/verify-canals.sh

      - name: المدخلات — الموردون والطلبات الجماعية والتوصيل بالرمز
        run: ./scripts/verify-supply-chain.sh

      - name: عروض البيع والشراء — القراءة للناس والكتابة بدالّة
        run: ./scripts/verify-market-offers.sh

      # والشركاتُ الشريكة. وأثقلُ ما تحرسه ليس التوثيق بل الخصوصيّة: الشركةُ
      # ترى مجموعةَ المزرعة ومساحتها ومحليّتها، ولا ترى صاحبها ولا موقعها حتى
      # يقبل طلبَها.
      - name: الشركات الشريكة — الاتّفاق المبدئي وفهرس المزارع والموافقة قبل الكشف
        run: ./scripts/verify-partners.sh

      # المرحلة الأولى من المحفظة: المنصّة لا تمسك المال، والمزارع يسجّل ما دفع.
      - name: مشروعي — قائمة المدخلات لصاحبها، والدفع للمورد مباشرةً
        run: ./scripts/verify-input-plans.sh

      # جرادٌ قرب الأرض ومرضُ ماشيةٍ في الولاية: يصل الخبر مرّةً، ولا يكتبه إلّا مفتاح الخدمة.
      - name: التنبيهات الحقليّة — الخبر مرّةً واحدة، ولمفتاح الخدمة وحده
        run: ./scripts/verify-field-alerts.sh

      # جاهزيّة الماشية للتصدير: السجلّ لصاحب القطيع، والقيدُ يُسحب ولا يُحذف.
      - name: جاهزيّة الماشية للتصدير — سجلّ الصحّة وأرقام الآذان لصاحب القطيع
        run: ./scripts/verify-herd-readiness.sh

      # ملفّ الصادر: المنتجُ والوجهةُ منفصلان، والطريقُ يُفتح مرّةً، وما لم يُدرس لا يبدو جاهزاً.
      - name: ملفّ الصادر — كلّ المنتجات والوجهات، والطريق يُفتح عند أوّل عرض
        run: ./scripts/verify-export-pairs.sh

      # تنبيهات الهاتف: الاشتراك لصاحبه، والإيقاف علامةٌ لا حذف، والمفاتيح لمفتاح الخدمة وحده.
      - name: تنبيهات الهاتف — الاشتراك لصاحبه والمفاتيح لمفتاح الخدمة
        run: ./scripts/verify-push.sh

      # أين السماد والجازولين: البلاغ بدالّة، والقراءة بلا اسم المُبلِّغ، والإخفاء علامةٌ لا حذف.
      - name: بلاغات السماد والوقود — بلا اسم المُبلِّغ، ولا يُحذف بلاغ
        run: ./scripts/verify-input-prices.sh

      - name: الردّ الآلي على الشكاوى
        run: ./scripts/verify-support-auto-reply.sh

      - name: تدقيقُ عملية الاستثمار
        run: ./scripts/verify-investment-audit.sh

      # وهذه تسأل السؤال المعاكس. الثلاث فوقها تُثبت ما تمنعه المنصّة؛ هذه
      # وحدها تُثبت أنّ صاحب الحقّ يمرّ — ومنصّةٌ ترفض كلَّ شيء تنجح في الثلاث.
      - name: الرحلة الذهبيّة
        run: ./scripts/verify-farmer-journey.sh

      - name: رحلة المستثمر
        run: ./scripts/verify-investor-journey.sh

      - name: رحلة الأرض والموسم
        run: ./scripts/verify-land-season-journey.sh

      # المرحلة ٣ تبدأ من هنا: درجةُ ثقةٍ محسوبةٌ من أدلّةٍ يسحبها صاحبُها ليست
      # درجةَ ثقة. فالدليلُ يُقفل قبل أن يُحسب عليه شيء.
      - name: قفلُ الأدلّة
        run: ./scripts/verify-evidence-lock.sh

      # وعلى الدليل المقفَل يُحسب الرقم: «٧ من ٨» — وأيُّ الثامن. وأكثرُ ما
      # تحرسه هذه ليس الحساب بل الحاجز: الدالّتان `security definer`، فحاجزُهما
      # الداخليُّ هو الحدُّ كلُّه بين رقمٍ للمشتري وتعدادٍ لمسوّدات الناس.
      - name: جاهزيّةُ العرض
        run: ./scripts/verify-export-readiness.sh

      # وجوازُ المزرعة: السجلُّ لا يعدّ إلّا ما حدث. وأثقلُ ما تحرسه ليس الحساب
      # بل الصلاحيّة — الهجرةُ تُسقط دالّةً تُرجع مالَ أيّ مزارعٍ يُطلب، و`drop`
      # تُعيد تنفيذَها إلى `PUBLIC` بلا كلمة.
      - name: جوازُ المزرعة
        run: ./scripts/verify-farm-passport.sh

      # وهذه تحرس تضييقَ حارس. `prevent_self_role_escalation` صار يسمح
      # investor ⇄ farmer، وتوسيعُ ثقبٍ في حارس أخطرُ أنواع التعديل — فتُفحص
      # الجهتان: أنّ المسموحَ يمرّ، وأنّ كلَّ طريقٍ إلى صلاحيةٍ ما زال يُرَدّ.
      - name: اختيار الدور
        run: ./scripts/verify-role-choice.sh

      # واللائحةُ تُعلن عمرَها. وأخطرُ ما تحرسه أنّ ممرّاً لم يُراجَع قطّ يُقرأ
      # متأخّراً لا حديثاً — و`null > 180` تساوي false، فالصياغةُ الساذجة تشهد
      # بالحداثة لما لم يفحصه أحد.
      - name: عمرُ اللائحة
        run: ./scripts/verify-rules-freshness.sh

      # ودورةُ حياة العقد. وأخطرُ ما تحرسه ليس الانتقالات بل الأسعار: `amount`
      # عمودٌ مولَّد من `quantity × unit_price`، وكلاهما كان قابلاً للتعديل من
      # أيّ الطرفين في أيّ وقت — و`sync_contract_total` يعيد حساب الإجماليّ
      # على الرقم الجديد بإخلاص.
      - name: دورةُ حياة العقد
        run: ./scripts/verify-contract-lifecycle.sh

      # والأخبار. وأخطرُ ما تحرسه أنّ المسوّدةَ لا تُرى: هذه أوّلُ جدولٍ يُسرّب
      # إلى **الخارج** إن أخطأت سياستُه، والصفحةُ التي تعرضه مخزَّنةٌ مؤقّتاً —
      # فتسريبةٌ واحدةٌ تُخبز في صفحةٍ تُقدَّم لكلّ قادم.
      - name: الأخبار
        run: ./scripts/verify-announcements.sh

      # وعقدُ الشراكة بين المستثمر وصاحب الأرض (البندان ١٢٤ و١٢٧). وأخطرُ ما
      # تحرسه أنّ التوقيعَ لنصٍّ واحد: تعديلٌ بعد توقيعٍ يبدأ نسخةً جديدة لا
      # يحملها التوقيعُ القديم، والعقدُ يُقفل بعد التوقيعين. ومعها أنّ صفَّ الأرض
      # لا يقرؤه غيرُ صاحبها، فلا يكشف الجدولُ ما يَعِد العرضُ بإخفائه.
      - name: عقدُ الشراكة
        run: ./scripts/verify-partnership-agreements.sh

      # والحسابُ الواحد للجانبين (البند ١٥١): «مستثمرٌ» يعرض أرضه، و«مزارعٌ»
      # يطلب الشراكة ويُقبل — نوعُ الحساب لا يمنع أحداً في القاعدة.
      - name: حسابٌ واحد يعرض أرضه ويستثمر
        run: ./scripts/verify-either-side.sh

      # وتقريرُ المعاينة بأجر (البند ١٢٨): لا شيءَ قبل موافقة صاحب الأرض، ولا
      # إسنادَ قبل تسجيل الأجر، والمفتّشُ ليس طرفاً، والتقريرُ يُقفل ببصمة،
      # وصورُه في الدلو لأطراف المعاينة وحدهم ولا تُحذف بعد تسجيلها.
      - name: تقريرُ المعاينة
        run: ./scripts/verify-land-inspections.sh

      # والمشروعُ يعرف أرضه (البندان ١٢٩ و١٣٠): لا يُربط إلّا بأرضٍ موثّقة
      # يملكها رافعه، والزائرُ يرى شارة «على أرضٍ موثّقة» لا الأرضَ نفسها.
      - name: المشروعُ على أرضٍ موثّقة
        run: ./scripts/verify-project-land.sh

      # والموسمُ من العقد الموقَّع (البند ١٢٩): يبدؤه صاحب الأرض على أرض العقد،
      # والمستثمرُ يقرأ مراحله وأدلّته ودفتره وصوره ولا يكتب فيها.
      - name: الموسمُ من العقد
        run: ./scripts/verify-season-from-agreement.sh

      # والأسعارُ التلقائيّة (البند ١٣١): الزائرُ يرى المنشور وحده ومتى بحثت
      # المنصّة آخر مرّة، والمحجوزُ ينتظر قرار المدير، والجدولُ يرفض الناقص.
      - name: الأسعارُ التلقائيّة
        run: ./scripts/verify-market-quotes.sh

      # ومزامنةُ بيانات الفاو (البند ١٩٧): الفرق ينتظر المدير، ويعتمده بدالّةٍ واحدة تحفظ ما استبدلته،
      # ومفتاحُ الخدمة لا يكتب في الأرقام المحمَّلة.
      - name: مزامنةُ بيانات الفاو
        run: ./scripts/verify-faostat-sync.sh

      # وإغلاقُ الحساب (البند ١٩٥): صاحبه يطلب والمدير يُغلق، ويتوقّف الدخول وتختفي الهويّة عن الناس،
      # والدفاتر والعقود تبقى، والهويّة الحقيقيّة عند المدير حتى يمحوها بسبب.
      - name: إغلاقُ الحساب
        run: ./scripts/verify-account-close.sh

      # وما يقرؤه الزائر (البند ١٣٢): لا يقرأ من فعل ولا ما كُتب للإدارة ولا
      # المواقع الدقيقة، والعضوُ لا يقرأ ملاحظة الإدارة على غيره، والصفحاتُ
      # تقرأ ما تطلبه، والسياساتُ التي كانت تقرأ owner_id بنفسها ما زالت تجيب.
      - name: ما يقرؤه الزائر
        run: ./scripts/verify-visitor-columns.sh

      # والدفعة صفر (البند ١٤٢): وقائعُ الأرض الموثّقة — الموقع والمساحة والماء
      # والتربة والحيازة — لا تتغيّر تحت الختم، والأرضُ القريبة من أرضٍ باسمٍ
      # آخر تُنبَّه لها الإدارة، وسؤالُ «هل لهذا العنوان حساب» للخادم وحده.
      - name: وقائعُ الأرض بعد التوثيق
        run: ./scripts/verify-land-facts.sh

      # وصندوق الرسائل (البند ١٣٧): المحادثة لأطرافها والإدارة، ولا رقمَ هاتفٍ
      # قبل قبول الطلب، والطلبُ المعتذَر عنه يُغلق محادثته، ولا يُحذف شيء.
      - name: صندوقُ الرسائل
        run: ./scripts/verify-messages.sh

      # الالتفافُ على الاعتماد والدليل والدفتر (البند ١٥٧): كلُّ كتابةٍ مباشرة من المتصفّح
      # تُجرَّب — إدراجُ مرحلةٍ معتمدة، وسحبُ الدليل على خطوتين، وتعديلُ دفترٍ مُقفل،
      # وفكُّ موسمٍ عن شراكته — وتُرفض، ويبقى الطريقُ العاديّ الذي يمشيه التطبيق يعمل.
      - name: الكتابةُ المباشرة على الصرف والأدلّة والدفتر
        run: ./scripts/verify-direct-writes.sh

      # والمالُ والفرصةُ وسجلُّ المنفّذ (البند ١٥٨): لا طلبَ استثمارٍ إلا على فرصةٍ مفتوحةٍ
      # حقيقيّة بحصصٍ متبقّية ومبلغٍ من السعر، ولا تأكيدَ إلا بدالّته، ولا يكتب الرافعُ المباعَ
      # والعائد، ولا يكتب أحدٌ سجلَّه بنفسه.
      - name: الاستثمار والفرصة وسجلّ المنفّذ
        run: ./scripts/verify-money-gates.sh

      # الأصلُ منعٌ والمنحُ صريح (البند ١٥٩): ما يُنشأ بعد اليوم لا يبلغ الزائر حتى يُمنح، ودوالّ الزنادات
      # لا يستدعيها أحد، ولا يُدرج مستخدمٌ ملفّه مديراً، وتغييرُ الأدوار مسجَّل، وللزائر سقفٌ في الكتابة.
      - name: الصلاحيّات الافتراضيّة وكتابات الزائر
        run: ./scripts/verify-default-access.sh

      # «المسجَّلون» (البند ١٥٤): للمدير وحده، وحسابُ الجوّال بجوّاله لا ببريده الوهميّ،
      # والحسابُ ذو الطريقتين صفٌّ واحد، والعدّاداتُ من القاعدة.
      - name: صفحة المسجَّلين
        run: ./scripts/verify-admin-users.sh

      # السقف اليوميّ على النموذج المدفوع (البند ١٦٣): لكلّ عنوانٍ وللمنصّة كلّها، يُغلق إن غاب الحدّ،
      # ولا يستدعيه إلا مفتاح الخدمة.
      - name: السقف اليوميّ على النموذج المدفوع
        run: ./scripts/verify-model-budget.sh

      # مكان المزرعة في عروض الصادر (البند ١٧٥، DB-12): الإحداثيّات والحدود لصاحب العرض وللمدير وحدهما،
      # ولا يقرؤها مسجَّلٌ آخر ولو كان العرض منشوراً.
      - name: مكان المزرعة في عروض الصادر
        run: ./scripts/verify-export-origins.sh

      # بطاقة الحقل (البند ١٦٤): فحوص الماء والتربة لصاحب الأرض وللمدير وحدهما، تُضاف ولا تُعدَّل،
      # ويحذفها صاحبها خلال ساعة، ولا يمسّها الزائر.
      - name: فحوص الأرض
        run: ./scripts/verify-land-tests.sh

      # تنبيهات الأسعار (البند ١٦٦): لصاحبها وحده يقرؤها ويوقفها، ولا كتابة مباشرة، وعشرةٌ شغّالة كحدٍّ
      # أقصى، والإطلاق لمفتاح الخدمة وحده فيغلق التنبيه ويكتب الإشعار معاً ولا يتكرّر.
      - name: تنبيهات الأسعار
        run: ./scripts/verify-price-alerts.sh

      # تربة موقع الأرض (البند ١٨٠، MAP-1): قراءةُ الأقمار تُكتب بدالّةٍ واحدة بمصدرها واحتمالها، ولا يدّعي
      # المالك مصدراً، وتسقط إن تحرّكت الأرض، ولا تعيد الأرضَ الموثّقة إلى المراجعة.
      - name: تربة موقع الأرض
        run: ./scripts/verify-land-soil.sh

      # محرّك الدفتر المزدوج (البند ١٨٦، المرحلة ١): قيدٌ غير متوازن لا يُحفظ ولو أُدخل مباشرةً، ولا قيدَ يُعدَّل
      # أو يُحذف ولو من مدير القاعدة، وسعر الصرف والتقريب والإقفال والعكس والتكرار، وعزل كلّ دفترٍ عن غيره.
      - name: محرّك الدفتر المزدوج
        run: ./scripts/verify-ledger-engine.sh

      # دفتر المزرعة (البند ١٨٧، المرحلة ٢): كلُّ سطرٍ في دفتر الموسم البسيط يُنتج قيداً مزدوجاً متوازناً في المعاملة
      # نفسها (مع رسملة التكلفة)، وتعديله وحذفه يعكسان قيده، وإقفال الموسم ينقل ما بقي إلى «تكلفة المباع»،
      # والجنيه يُحوَّل بسعرٍ مسجَّل، والترحيل الأوّل لا يتكرّر، والمطابقة تكشف أيّ فرق.
      - name: دفتر المزرعة
        run: ./scripts/verify-farm-book.sh

      # إشراف المنصّة (البند ١٩١): إحصاءاتٌ مجمَّعة بلا أسماء تُحجب إن قلّ مساهموها أو هيمن أحدهم، وفحصُ دفترٍ
      # بعينه بسببٍ ومدّةٍ يُخطَر به صاحبه ولا يُمحى، والمدير لا يكتب في دفترٍ غير دفتر المنصّة قطّ، ومجاميعُ الشبكة
      # تُسجَّل في حساباتٍ إحصائيّة في دفتر المنصّة وتتبع كلَّ تغيّر.
      - name: إشراف المنصّة
        run: ./scripts/verify-oversight.sh

      # تسوية القيود الآجلة (البند ١٨٧ ٢ج): «سدّدتُ» و«قبضتُ» قيدٌ مستقلّ يُغلق الدين، وفرقُ الصرف يُقفل معه
      # في المعاملة نفسها، وما سُدِّد لا يُعدَّل ولا يُحذف حتى يُلغى السداد، ولا يسدّد أحدٌ قيدَ غيره.
      - name: تسوية القيود الآجلة
        run: ./scripts/verify-farm-settle.sh

      # تقارير الدفاتر (البند ١٨٧ ٢د): قائمة الدخل والميزانيّة والتدفّقات النقديّة وربحيّة المواسم تتّفق مع بعضها
      # ومع ميزان المراجعة، وحسابات ٩xxx الإحصائيّة خارجها، ولا يقرأ أحدٌ دفتر غيره.
      - name: تقارير الدفاتر
        run: ./scripts/verify-ledger-reports.sh

      # القيود المتقابلة (البند ١٨٨ ب): اقتراحٌ من شريكٍ في عقدٍ موقَّع لا يُقيَّد قبل تأكيد الآخر، وعند
      # التأكيد يُقيَّد الدفتران في معاملةٍ واحدة بالرابط نفسه أو لا يُقيَّد شيء، ولا يغيّر أحدٌ ما بُتّ فيه.
      - name: القيود المتقابلة
        run: ./scripts/verify-ledger-links.sh

      # إلغاء القيد المتقابل باتّفاق الطرفين (البند ١٩٢): طلبٌ بسبب، فإن قبل الآخر عُكس القيدان معاً في معاملةٍ واحدة،
      # وإن رفض أو سُحب بقي كلّ شيءٍ كما هو؛ وللإدارة أعدادٌ بلا أسماء لما تأخّر ولفرق الذمّتين تُحجب بقواعد المستوى ١.
      - name: إلغاء القيد المتقابل
        run: ./scripts/verify-ledger-link-reversal.sh

      # إصلاحات مراجعة الدفتر (البند ١٩٨): المدير لا يكتب في دفتر موسم أحد، وسلامة الدفاتر بلا مجاميع أحد، والإحصاءات
      # بأشهرٍ منتهية كاملة بشهر التسجيل فلا تُطرح قراءةٌ من قراءة، وقاعدة الهيمنة في كلّ خليّة، وما يكتبه النظام لا
      # يُعكس يدويّاً، ولا مبلغ دون سنت، وإغلاق الموسم وتسجيل تكلفةٍ معاً لا يتركان مالاً في المحاصيل قيد النموّ.
      - name: إصلاحات مراجعة الدفتر
        run: ./scripts/verify-ledger-review.sh

      # معرّفات الحسابات في المشاريع والموردين (البند ١٨١): لا يقرؤها كلّ عضو، ويقرؤها صاحب الصفّ والمدير بدالّتين،
      # وأرض المشروع تُعطى لصفحته حين تكون معروضةً للمستثمرين.
      - name: معرّفات الحسابات
        run: ./scripts/verify-private-ids.sh

      # إيجار الجرّار والحجز الجماعي (البند ١٦٨): التوفّر بتاريخٍ لا يُزوَّر، والحجز في المحليّة نفسها من أرض الموسم، وكلّ عضوٍ
      # عقدٌ عاديّ بسعرٍ مجمَّد يُقبل أو يُرفض معاً، ولا هاتف ولا مال، واسم الحساب المُغلَق يُخفى.
      - name: إيجار الجرّار
        run: ./scripts/verify-tractor-booking.sh

      # مكتبة الدراسات والبحوث (البند ٢٠٢): الكتابة من الخادم وحده وكلّ ما يكتبه ينتظر، والزائر يقرأ المنشور بلا تواصل
      # المرسِل، والمرسِل يرى ما أرسل، والإدارة وحدها تنشر أو تردّ بسبب ويُخبَر المرسِل.
      - name: مكتبة الدراسات والبحوث
        run: ./scripts/verify-research-library.sh

      # وضع الوكيل (البند ١٦٩): لا يعمل وكيلٌ عن مزارعٍ إلا بإذنٍ قبله المزارع، في ما أذن فيه وحده، وما دامت شركته
      # موثّقةً والإذن قائماً؛ وكلّ ما يكتبه يُسجَّل ولا يُمحى، والأرض لا تنتقل من صاحبها.
      - name: وضع الوكيل
        run: ./scripts/verify-agent-mandates.sh

      # العقد الآجل (البند ١٧٠): يقترحه طرفٌ ويوقّعه الآخر، وشروطه لا تتغيّر، ولا يُلغى عقدٌ موقّعٌ إلا بالطرفين، والتسليم
      # يسجّله المشتري ويؤكّده المزارع، والنزاع تفصل فيه الإدارة؛ وكلّ خطوةٍ في سجلٍّ لا يُعدَّل.
      - name: العقد الآجل
        run: ./scripts/verify-forward-contracts.sh

      # الرمز الثاني للإدارة (AUTH-04، البند ١٤١): لا يكون المرء مديراً في القاعدة إلا في جلسةٍ دخلت بالرمز الثاني،
      # والمفتاح الذي يوقف الشرط لا يقلبه إلا مديرٌ دخل به.
      - name: الرمز الثاني للإدارة
        run: ./scripts/verify-admin-second-factor.sh

      # استعادة كلمة مرور حساب الجوال (AUTH-05): الطلب من الخادم وحده ولا يكشف أيّ رقمٍ له حساب، وطلبٌ مفتوحٌ واحد للحساب،
      # والإدارة وحدها ترى الطلبات وتغلقها، والردّ بسبب.
      - name: استعادة كلمة مرور الجوال
        run: ./scripts/verify-password-reset.sh

      # مزارعٌ بلا جوّال (البند ١٦٩): الجمعيّة الموثّقة وحدها تسجّله، بحسابٍ صنعه الخادم للتوّ وصورتين من مجلّدها، ولا
      # يُكرَّر رقمه الوطنيّ، ولا تعمل عنه قبل أن تعتمده الإدارة؛ والإدارة وحدها تراجع وتربطه بجوّال.
      - name: مزارعٌ بلا جوّال
        run: ./scripts/verify-managed-farmers.sh

      # دفتر المنصّة والرسوم ومطابقة الكشف (البند ١٨٩): رسمٌ يقترحه المدير ويؤكّده الدافع فيُقيَّد في الدفترين معاً بالرابط
      # والسعر نفسيهما، ولا يُعكس جانبٌ وحده؛ والكشف يُطابَق ولا يكتب في الدفتر أبداً.
      - name: دفتر المنصّة والرسوم
        run: ./scripts/verify-ledger-platform.sh

      # السلسلة الكاملة (فحص 3 نوفمبر: code-quality-1 وdb-b-1..3): كلّ هجرةٍ بالترتيب بصلاحيّات Supabase الافتراضيّة
      # وحدها، ثمّ كلّ جدولٍ يقرؤه الموقع يقرؤه العضو، وكلّ دالّةٍ في قيد تحقّق ينفّذها، وكلّ دالّةٍ يناديها الموقع موجودة.
      # البوّابات الأخرى تمنح نفسها الصلاحيّات، فلم ترَ ما نسيته هجرة.
      - name: السلسلة الكاملة
        run: ./scripts/verify-migration-chain.sh
