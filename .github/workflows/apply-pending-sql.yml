# تطبيق هجرة «مفتاح القيد» على الإنتاج بمعاملةٍ واحدة (المالك، 6 نوفمبر 2026: «نعم، طبّقه»): عمودٌ يُضاف فارغاً،
# وفهرسٌ جزئيّ، وزنادٌ بجانب ما هو قائم — لا حذف ولا تعديل لبيانات. تُحذف قبل الدمج.
name: Apply pending SQL bundle

on:
  push:
    branches: [claude/project-review-analysis-dt7lsy]
    paths: [".github/workflows/apply-pending-sql.yml"]

permissions:
  contents: read

concurrency:
  group: apply-pending-sql
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 060000 لم تُطبَّق، و050000 طُبِّقت، والعمود غير موجود
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select (select count(*) from supabase_migrations.schema_migrations where name = 'ledger_client_key')::text || ',' || (select count(*) from supabase_migrations.schema_migrations where name = 'agent_writes_stages')::text || ',' || (select count(*) from information_schema.columns where table_schema = 'public' and table_name = 'ledger_entries' and column_name = 'client_key')::text" | tee state.txt
          test "$(tr -d '[:space:]' < state.txt)" = "0,1,0"
      - name: عدد القيود قبل
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc "select count(*) from public.ledger_entries" | tee before.txt
      - name: تطبيق 060000 (معاملةٌ واحدة)
        run: |
          { echo "begin;"; cat supabase/migrations/20261106060000_ledger_client_key.sql; \
            echo "insert into supabase_migrations.schema_migrations (version, name) values ('20261106060000', 'ledger_client_key') on conflict do nothing;"; \
            echo "commit;"; } > apply.sql
          docker run --rm -v "$PWD:/w:ro" postgres:17 psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f /w/apply.sql
      - name: التحقّق
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select (select count(*) from information_schema.columns where table_schema = 'public' and table_name = 'ledger_entries' and column_name = 'client_key')::text || ',' || (select count(*) from pg_indexes where indexname = 'ledger_entries_season_client_key')::text || ',' || (select count(*) from pg_trigger where tgname = 'ledger_entries_client_key_gate')::text || ',' || (select count(*) from supabase_migrations.schema_migrations where name = 'ledger_client_key')::text" | tee n.txt
          test "$(tr -d '[:space:]' < n.txt)" = "1,1,1,1"
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc "select count(*) from public.ledger_entries" | tee after.txt
          test "$(tr -d '[:space:]' < before.txt)" = "$(tr -d '[:space:]' < after.txt)"
