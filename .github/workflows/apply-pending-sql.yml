# تطبيق هجرتين على الإنتاج بمعاملةٍ واحدة (قرارات المالك 6 نوفمبر 2026): الكركديه إلى أوروبا «يُنصح بها» (040000)،
# والوكيل يعتمد مراحل الموسم ويرفع أدلّتها بعلامةٍ واعتراض (050000). تُحذف قبل الدمج.
name: Apply pending SQL bundle

on:
  push:
    branches: [claude/project-review-analysis-dt7lsy]
    paths: [".github/workflows/apply-pending-sql.yml"]

permissions:
  contents: read

concurrency:
  group: apply-pending-sql
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 040000 و050000 لم تُطبَّقا، و030000 طُبِّقت
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select (select count(*) from supabase_migrations.schema_migrations where name in ('hibiscus_eu_phyto_recommended','agent_writes_stages'))::text || ',' || (select count(*) from supabase_migrations.schema_migrations where name = 'export_corridors_studied')::text" | tee state.txt
          test "$(tr -d '[:space:]' < state.txt)" = "0,1"
      - name: تطبيق 040000 و050000 (معاملةٌ واحدة)
        run: |
          { echo "begin;"; cat supabase/migrations/20261106040000_hibiscus_eu_phyto_recommended.sql; \
            echo "insert into supabase_migrations.schema_migrations (version, name) values ('20261106040000', 'hibiscus_eu_phyto_recommended') on conflict do nothing;"; \
            cat supabase/migrations/20261106050000_agent_writes_stages.sql; \
            echo "insert into supabase_migrations.schema_migrations (version, name) values ('20261106050000', 'agent_writes_stages') on conflict do nothing;"; \
            echo "commit;"; } > apply.sql
          docker run --rm -v "$PWD:/w:ro" postgres:17 psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f /w/apply.sql
      - name: التحقّق
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select (select count(*) from pg_proc where proname in ('agent_stage_complete','agent_stage_evidence_add','agent_write_object'))::text || ',' || (select count(*) from export_corridor_reviews where reviewed_at = '2026-11-06 00:00+00')::text" | tee n.txt
          test "$(tr -d '[:space:]' < n.txt)" = "3,1"
