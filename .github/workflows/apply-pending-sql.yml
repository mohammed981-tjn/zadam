# تطبيق هجرة الأصول الثابتة (البند ١٩٠) على الإنتاج، مرّةً واحدة وبمعاملةٍ واحدة. المالك، 5 نوفمبر 2026: «بلا توقّف».
# أداة Supabase في الجلسة تطلب موافقةً لا تصل المالك، فتُطبَّق من هنا بالسرّ SUPABASE_DB_URL كما طُبِّقت حزمة 4 نوفمبر.
# الهجرة تضيف جدولاً ودوالّ ولا تمسّ بياناً قائماً. يعمل حين يتغيّر هذا الملفّ وحده على هذا الفرع، ويُحذف قبل الدمج.
name: Apply pending SQL bundle

on:
  push:
    branches: [claude/project-review-analysis-dt7lsy]
    paths: [".github/workflows/apply-pending-sql.yml"]

permissions:
  contents: read

concurrency:
  group: apply-pending-sql
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 20261106010000 لم تُطبَّق بعد، وما قبلها طُبِّق
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select (select count(*) from supabase_migrations.schema_migrations where name = 'fixed_assets')::text || ',' || (select count(*) from supabase_migrations.schema_migrations where name = 'research_uploads_issued')::text" | tee state.txt
          test "$(tr -d '[:space:]' < state.txt)" = "0,1"
      - name: تطبيق 20261106010000 (معاملةٌ واحدة)
        run: |
          { echo "begin;"; cat supabase/migrations/20261106010000_fixed_assets.sql; \
            echo "insert into supabase_migrations.schema_migrations (version, name) values ('20261106010000', 'fixed_assets') on conflict do nothing;"; \
            echo "commit;"; } > apply.sql
          docker run --rm -v "$PWD:/w:ro" postgres:17 psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f /w/apply.sql
      - name: التحقّق
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select count(*) from pg_proc where proname in ('ledger_asset_add','ledger_asset_depreciate','ledger_depreciate_all','ledger_fixed_assets_summary','_ledger_depreciate')" | tee n.txt
          test "$(tr -d '[:space:]' < n.txt)" = "5"
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc "select ledger_depreciate_all()"
