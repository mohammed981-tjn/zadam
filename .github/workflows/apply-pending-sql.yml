# تطبيق حزمة القاعدة على الإنتاج، مرّةً واحدة، بمعاملةٍ واحدة (فحص 3 نوفمبر 2026؛ المالك، 4 نوفمبر، السؤال 29: «كلّه بلا توقّف»).
#
# أداة Supabase في الجلسة تطلب موافقة المالك على كلّ أمرٍ يغيّر القاعدة، وطلبها لم يصله. فالحزمة تُطبَّق من هنا بالسرّ
# SUPABASE_DB_URL نفسه الذي تستعمله النسخة الاحتياطيّة (db-backup.yml)، بـ psql و ON_ERROR_STOP: إن فشل أمرٌ لم يُطبَّق
# شيءٌ من الحزمة (begin … commit). ويعمل حين يتغيّر هذا الملفّ وحده على هذا الفرع.
name: Apply pending SQL bundle

on:
  push:
    branches: [claude/project-review-analysis-dt7lsy]
    paths: [".github/workflows/apply-pending-sql.yml"]

permissions:
  contents: read

concurrency:
  group: apply-pending-sql
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: الحزمة لم تُطبَّق بعد
        run: |
          docker run --rm -e URL="$SUPABASE_DB_URL" postgres:17 psql "$URL" -tAc \
            "select count(*) from supabase_migrations.schema_migrations where name in ('ledger_review_fixes','research_uploads_issued')" | tee before.txt
          test "$(tr -d '[:space:]' < before.txt)" = "0"
      - name: تطبيق الحزمة (معاملةٌ واحدة)
        run: |
          docker run --rm -e URL="$SUPABASE_DB_URL" -v "$PWD/docs/sql:/sql:ro" postgres:17 \
            psql "$URL" -v ON_ERROR_STOP=1 -q -f /sql/pending-2026-10-26.sql
      - name: سُجِّلت الهجرات الخمس والعشرون
        run: |
          docker run --rm -e URL="$SUPABASE_DB_URL" postgres:17 psql "$URL" -tAc \
            "select count(*) from supabase_migrations.schema_migrations where version between '20261025160000' and '20261104080000' and name <> 'visitor_writes_through_server' and name <> 'admin_second_factor'"
