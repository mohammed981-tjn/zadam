# تطبيق حزمة القاعدة على الإنتاج، مرّةً واحدة، بمعاملةٍ واحدة (فحص 3 نوفمبر 2026؛ المالك، 4 نوفمبر، السؤال 29: «كلّه بلا توقّف»).
#
# أداة Supabase في الجلسة تطلب موافقة المالك على كلّ أمرٍ يغيّر القاعدة، وطلبها لم يصله. فالحزمة تُطبَّق من هنا بالسرّ
# SUPABASE_DB_URL نفسه الذي تستعمله النسخة الاحتياطيّة (db-backup.yml)، بـ psql و ON_ERROR_STOP: إن فشل أمرٌ لم يُطبَّق
# شيءٌ من الحزمة (begin … commit). ويعمل حين يتغيّر هذا الملفّ وحده على هذا الفرع.
name: Apply pending SQL bundle

on:
  push:
    branches: [claude/project-review-analysis-dt7lsy]
    paths: [".github/workflows/apply-pending-sql.yml"]

permissions:
  contents: read

concurrency:
  group: apply-pending-sql
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # الحزمة طُبِّقت (4 نوفمبر، 02:44). وهذه الثانية بعد نشر الموقع الجديد: الكتابة في نموذجَي التواصل من الخادم وحده.
      - name: 20261025200300 لم تُطبَّق بعد، والحزمة طُبِّقت
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select (select count(*) from supabase_migrations.schema_migrations where name = 'visitor_writes_through_server')::text || ',' || (select count(*) from supabase_migrations.schema_migrations where name = 'research_uploads_issued')::text" | tee state.txt
          test "$(tr -d '[:space:]' < state.txt)" = "0,1"
      - name: تطبيق 20261025200300 (معاملةٌ واحدة)
        run: |
          { echo "begin;"; cat supabase/migrations/20261025200300_visitor_writes_through_server.sql; \
            echo "insert into supabase_migrations.schema_migrations (version, name) values ('20261025200300', 'visitor_writes_through_server') on conflict do nothing;"; \
            echo "commit;"; } > late.sql
          docker run --rm -v "$PWD:/w:ro" postgres:17 psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f /w/late.sql
