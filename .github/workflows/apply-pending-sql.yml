# تطبيق هجرة بيع الأصول الثابتة واستبعادها (البند ١٩٠) على الإنتاج، مرّةً وبمعاملةٍ واحدة. المالك، 5 نوفمبر 2026: «كمّل بلا توقّف».
# تضيف أعمدةً وحساباً (7140) لدفاتر المزارع ودالّةً، وتعيد كتابة دالّتين؛ لا تمسّ قيداً قائماً. تُحذف قبل الدمج.
name: Apply pending SQL bundle

on:
  push:
    branches: [claude/project-review-analysis-dt7lsy]
    paths: [".github/workflows/apply-pending-sql.yml"]

permissions:
  contents: read

concurrency:
  group: apply-pending-sql
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 20261106020000 لم تُطبَّق بعد، و010000 طُبِّقت
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select (select count(*) from supabase_migrations.schema_migrations where name = 'fixed_asset_disposal')::text || ',' || (select count(*) from supabase_migrations.schema_migrations where name = 'fixed_assets')::text" | tee state.txt
          test "$(tr -d '[:space:]' < state.txt)" = "0,1"
      - name: تطبيق 20261106020000 (معاملةٌ واحدة)
        run: |
          { echo "begin;"; cat supabase/migrations/20261106020000_fixed_asset_disposal.sql; \
            echo "insert into supabase_migrations.schema_migrations (version, name) values ('20261106020000', 'fixed_asset_disposal') on conflict do nothing;"; \
            echo "commit;"; } > apply.sql
          docker run --rm -v "$PWD:/w:ro" postgres:17 psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f /w/apply.sql
      - name: التحقّق
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select (select count(*) from pg_proc where proname = 'ledger_asset_dispose')::text || ',' || (select count(*) from ledger_books b where kind = 'farm' and not exists (select 1 from ledger_accounts a where a.book_id = b.id and a.system_key = 'asset_disposal_loss'))::text" | tee n.txt
          test "$(tr -d '[:space:]' < n.txt)" = "1,0"
