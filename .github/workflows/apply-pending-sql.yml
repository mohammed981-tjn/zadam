# تطبيق هجرة طرق التصدير المدروسة (البند ١١٨) على الإنتاج، مرّةً وبمعاملةٍ واحدة. المالك، 5 نوفمبر 2026: «كمّل بلا توقّف».
# تضيف أنواع وثائق وطرقاً وشروطاً ومراجعات؛ لا تحذف ولا تعدّل شرطاً قائماً. تُحذف قبل الدمج.
name: Apply pending SQL bundle

on:
  push:
    branches: [claude/project-review-analysis-dt7lsy]
    paths: [".github/workflows/apply-pending-sql.yml"]

permissions:
  contents: read

concurrency:
  group: apply-pending-sql
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 20261106030000 لم تُطبَّق بعد، و020000 طُبِّقت
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select (select count(*) from supabase_migrations.schema_migrations where name = 'export_corridors_studied')::text || ',' || (select count(*) from supabase_migrations.schema_migrations where name = 'fixed_asset_disposal')::text" | tee state.txt
          test "$(tr -d '[:space:]' < state.txt)" = "0,1"
      - name: تطبيق 20261106030000 (معاملةٌ واحدة)
        run: |
          { echo "begin;"; cat supabase/migrations/20261106030000_export_corridors_studied.sql; \
            echo "insert into supabase_migrations.schema_migrations (version, name) values ('20261106030000', 'export_corridors_studied') on conflict do nothing;"; \
            echo "commit;"; } > apply.sql
          docker run --rm -v "$PWD:/w:ro" postgres:17 psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f /w/apply.sql
      - name: التحقّق
        run: |
          docker run --rm postgres:17 psql "$SUPABASE_DB_URL" -tAc \
            "select (select count(*) from export_corridor_reviews where reviewed_at = '2026-11-05 21:00+00')::text || ',' || (select count(*) from export_document_types where code in ('import_permit','certificate_of_origin','halal_slaughter','fumigation_cert','prior_notice','facility_registration'))::text" | tee n.txt
          test "$(tr -d '[:space:]' < n.txt)" = "12,6"
