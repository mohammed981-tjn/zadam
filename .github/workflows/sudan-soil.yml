name: Sudan soil map

# Reads the most probable soil group for every cell of the national rain map
# from SoilGrids and commits data/sudan-soil.json. See
# scripts/fetch-sudan-soil.ts for what and why.
#
# It runs here because SoilGrids is not reachable from the environment this
# repository is developed in. It reads the SoilGrids raster with GDAL over
# range requests, every point in one process: a few minutes. (The first two
# runs asked the throttled query service point by point and spent 462 billed
# minutes reading 55 cells — see scripts/fetch-sudan-soil.ts.)
#
# Manual only, like the corridor map: the ground does not change between
# merges, and a workflow that commits on push races the next push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  soil:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install GDAL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin

      # No continue-on-error: a run that cannot name the raster's groups, or
      # disagrees with the cells already read, must not commit anything.
      - name: Fetch the soil
        run: npx tsx scripts/fetch-sudan-soil.ts

      - name: Report what will be committed
        run: |
          node -e "
            const d = require('./data/sudan-soil.json');
            const n = {};
            for (const c of d.cells) n[c.wrb] = (n[c.wrb] || 0) + 1;
            console.log(d.cells.length, 'cells:', n);
          "

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/sudan-soil.json
          if git diff --cached --quiet; then
            echo 'The soil map is unchanged since the last fetch.'
            exit 0
          fi
          git commit -m 'Refresh the Sudan soil map (SoilGrids)'
          # A long run can end after someone else has pushed; replay this one
          # commit on top rather than lose the survey to a rejected push.
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
